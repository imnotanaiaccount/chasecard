<!-- Debug console for mobile — visit the site with ?eruda=true in the URL
     to get a floating in-page DevTools panel (Console/Network/Elements
     tabs). Does nothing for anyone who doesn't pass that flag, so it's
     zero-cost for real visitors and doesn't touch the Lighthouse score.
     Remove this block once you're done debugging, or just leave it —
     it's inert unless someone deliberately appends ?eruda=true. -->
<script>
(function(){
  if(!/[?&]eruda=true\b/.test(location.search)) return;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/eruda';
  s.onload = function(){ eruda.init(); };
  document.head.appendChild(s);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<!-- Resource hints — discovered by the browser's preload scanner while
     still parsing this HTML, so these connections start warming up
     well before app.js (which injects a similar but not identical set
     at runtime — see its setupPWA() comment) even finishes downloading.
     preconnect (full DNS+TCP+TLS) is for hosts every session hits
     immediately: the fonts, Supabase (session/profile check on boot),
     and the image CDN (first set images shown on the home screen).
     Kept as the very first things in <head> (ahead of the affiliate
     script below) so the preload scanner sees them before anything
     else competes for its attention. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mdtpdqwxegmseidxnnvb.supabase.co">
<link rel="preconnect" href="https://chase-cards-img.joshhawleyofficial.workers.dev" crossorigin>
<!-- Loaded non-blocking: media="print" makes the browser fetch it at
     normal priority without letting it hold up first paint, then
     onload flips it to "all" once it's actually ready. Text still
     renders immediately in the fallback system font (font-display:swap
     below) and swaps to the real one when it lands — same visual result,
     just without a render-blocking round trip in between. The noscript
     fallback covers the (rare) no-JS case. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"></noscript>

     SETUP.md, not here — keeping it out of the shipped HTML means it isn't
     readable via "View Source" on the live site. -->

<!-- Structured data — schema.org WebApplication. This is what lets Google
     (rich results) and AI answer engines (Perplexity, ChatGPT Search,
     Google AI Overviews, etc.) describe this accurately instead of
     guessing from prose alone: free, no login required, browser-based.
     See also /llms.txt (plain-language equivalent for LLM crawlers that
     don't parse JSON-LD) and /robots.txt (explicitly allows the major
     AI crawlers — a site that blocks them can't be cited by them). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Chase Cards",
  "url": "https://chasecards.netlify.app/",
  "description": "Open realistic Pokémon-style and One Piece booster packs, collect cards, trade, and chase rare pulls. Free to play, no download or account required.",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Any (web browser)",
  "browserRequirements": "Requires JavaScript",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "image": "https://chasecards.netlify.app/og-image.png"
}
</script>

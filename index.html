<!--
==============================================================================
 SUPABASE SETUP — run this once in your Supabase project's SQL editor.
 This app needs a real backend for credits/referrals so nothing can be
 faked or edited client-side (that would be a shortcut and a cheat vector).
==============================================================================

create table profiles (
  id uuid primary key references auth.users(id) on delete cascade,
  email text,
  credits integer not null default 500,
  referral_code text unique not null,
  referred_by uuid references profiles(id),
  created_at timestamptz default now()
);

-- public-safe lookup view so referral codes can be resolved without exposing
-- every user's balance/email through row-level security
create view referral_lookup as select id, referral_code from profiles;

create table openings (
  id bigint generated always as identity primary key,
  user_id uuid references profiles(id) on delete cascade,
  set_id text not null,
  set_name text not null,
  cards jsonb not null,
  cost integer not null,
  created_at timestamptz default now()
);

create or replace function handle_new_user()
returns trigger language plpgsql security definer as $$
begin
  insert into profiles (id, email, referral_code)
  values (new.id, new.email, substr(md5(random()::text || new.id::text), 1, 8));
  return new;
end; $$;
create trigger on_auth_user_created after insert on auth.users
  for each row execute function handle_new_user();

create or replace function spend_credits(p_amount integer)
returns integer language plpgsql security definer as $$
declare new_balance integer;
begin
  update profiles set credits = credits - p_amount
  where id = auth.uid() and credits >= p_amount
  returning credits into new_balance;
  if new_balance is null then raise exception 'insufficient_credits'; end if;
  return new_balance;
end; $$;

create or replace function redeem_referral(p_code text)
returns void language plpgsql security definer as $$
declare v_referrer uuid;
begin
  select id into v_referrer from profiles where referral_code = p_code and id != auth.uid();
  if v_referrer is null then raise exception 'invalid_code'; end if;
  update profiles set referred_by = v_referrer where id = auth.uid() and referred_by is null;
  if found then
    update profiles set credits = credits + 250 where id = v_referrer;
    update profiles set credits = credits + 250 where id = auth.uid();
  end if;
end; $$;

-- only ever called from a trusted server context (Stripe webhook edge
-- function with the service-role key), never from this client file
create or replace function add_credits(p_user uuid, p_amount integer)
returns void language plpgsql security definer as $$
begin
  update profiles set credits = credits + p_amount where id = p_user;
end; $$;

alter table profiles enable row level security;
create policy "read own profile" on profiles for select using (auth.uid() = id);
alter table openings enable row level security;
create policy "own openings" on openings for all using (auth.uid() = user_id);
==============================================================================
-->

<style>
:root{
  --void:#0a0c10; --panel:#12151c; --panel-2:#181c26; --edge:#262b38;
  --text:#edeef2; --dim:#8a90a0; --dim-2:#565c6c;
  --cyan:#4de8e0; --magenta:#e84dc0; --gold:#f0b94d; --danger:#e8544d;
  --tier-common:#7d8494; --tier-uncommon:#5fd0a8; --tier-rare:#5fa8f0;
  --tier-holo:#8f7bf0; --tier-double:#e05fd0; --tier-ultra:#f0b94d;
  --tier-illus:#f08a5f; --tier-sillus:#ff6ec7; --tier-hyper:#ffd35f;
  --font-display:'Rajdhani',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top); --safe-bottom:env(safe-area-inset-bottom);
}
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--void); color:var(--text); font-family:var(--font-body); overscroll-behavior:none; width:100%; overflow-x:hidden;}
body{padding-top:var(--safe-top); padding-bottom:var(--safe-bottom); min-height:100vh;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(77,232,224,0.08), transparent),
    radial-gradient(ellipse 60% 40% at 90% 100%, rgba(232,77,192,0.06), transparent),
    var(--void);
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:700; letter-spacing:0.02em;}
button{font-family:var(--font-body); cursor:pointer; border:none; background:none; color:inherit;}
a{color:inherit;}
::-webkit-scrollbar{display:none;}
.hidden{display:none !important;}

/* ---------- App shell ---------- */
#app{max-width:560px; margin:0 auto; padding:16px 16px 100px; min-height:100vh; position:relative;}
.topbar{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 18px;}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:22px; font-weight:700;}
.brand .dot{width:9px; height:9px; border-radius:50%; background:conic-gradient(var(--cyan),var(--magenta),var(--gold),var(--cyan)); animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.credits-pill{display:flex; align-items:center; gap:7px; background:var(--panel); border:1px solid var(--edge); padding:7px 14px; border-radius:999px; font-family:var(--font-mono); font-weight:700; font-size:15px;}
.credits-pill .coin{width:15px; height:15px; border-radius:50%; background:linear-gradient(135deg,var(--gold),#c98d2c); box-shadow:inset 0 0 0 2px rgba(0,0,0,0.15);}
.credits-pill.tappable{transition:transform .15s;}
.credits-pill.tappable:active{transform:scale(0.94);}

.tabs{position:fixed; bottom:0; left:0; right:0; display:flex; background:rgba(10,12,16,0.9); backdrop-filter:blur(14px); border-top:1px solid var(--edge); padding:8px 12px calc(8px + var(--safe-bottom)); z-index:40; max-width:560px; margin:0 auto;}
.tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--dim-2); font-size:11px; font-weight:600;}
.tab.active{color:var(--cyan);}
.tab svg{width:22px; height:22px;}

/* ---------- Auth ---------- */
.auth-wrap{min-height:88vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:22px; padding:20px;}
.auth-wrap .display{font-size:34px; line-height:1.1;}
.auth-wrap .sub{color:var(--dim); font-size:15px; max-width:320px;}
.auth-form{width:100%; max-width:320px; display:flex; flex-direction:column; gap:10px;}
input[type=email], input[type=text]{width:100%; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:14px 16px; color:var(--text); font-size:16px; font-family:var(--font-body);}
input:focus{outline:none; border-color:var(--cyan);}
.btn{padding:14px 20px; border-radius:12px; font-weight:700; font-size:15px; text-align:center; transition:transform .12s, filter .12s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#2ea89f); color:#04211f;}
.btn-secondary{background:var(--panel); border:1px solid var(--edge); color:var(--text);}
.btn-gold{background:linear-gradient(135deg,var(--gold),#c98d2c); color:#241a02;}
.btn:disabled{opacity:0.4; pointer-events:none;}
.hint{font-size:12.5px; color:var(--dim-2);}

/* ---------- Sets grid ---------- */
.section-title{font-size:13px; text-transform:uppercase; letter-spacing:0.12em; color:var(--dim); margin:22px 0 10px; font-weight:700;}
.era-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:4px;}
.era-chip{flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--panel); border:1px solid var(--edge); font-size:13px; font-weight:600; color:var(--dim); white-space:nowrap;}
.era-chip.active{background:rgba(77,232,224,0.12); border-color:var(--cyan); color:var(--cyan);}
.set-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.set-card{background:var(--panel); border:1px solid var(--edge); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:8px; transition:transform .15s, border-color .15s;}
.set-card:active{transform:scale(0.96); border-color:var(--cyan);}
.set-card img{height:28px; object-fit:contain; align-self:flex-start; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));}
.set-card .name{font-family:var(--font-display); font-weight:700; font-size:15px; line-height:1.15;}
.set-card .meta{font-size:11.5px; color:var(--dim-2);}
.skeleton{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-2) 37%,var(--panel) 63%); background-size:400% 100%; animation:shimmer 1.4s infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}

/* ---------- Pack detail ---------- */
.pack-hero{display:flex; flex-direction:column; align-items:center; text-align:center; padding:26px 10px 10px;}
.pack-hero img.logo{height:44px; object-fit:contain; margin-bottom:10px;}
.pack-art{width:190px; height:264px; border-radius:14px; position:relative; margin:14px 0 20px; background:linear-gradient(160deg,#1c2130,#0d1017); border:1px solid var(--edge); box-shadow:0 20px 50px -12px rgba(0,0,0,0.6); overflow:hidden;}
.pack-art::before{content:''; position:absolute; inset:0; background:conic-gradient(from 200deg,var(--cyan),var(--magenta),var(--gold),var(--cyan)); opacity:0.14; animation:spin 6s linear infinite;}
.pack-art img{position:relative; width:100%; height:100%; object-fit:cover;}
.pack-count{font-family:var(--font-mono); font-size:12.5px; color:var(--dim); margin-bottom:16px;}
.odds-box{width:100%; background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:14px 16px; margin-top:10px;}
.odds-box .row{display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--dim);}
.odds-box .row b{color:var(--text); font-weight:600;}
.open-cta{position:sticky; bottom:calc(70px + var(--safe-bottom)); margin-top:20px;}

/* ---------- Opening / reveal ---------- */
.reveal-screen{position:fixed; inset:0; background:radial-gradient(circle at 50% 20%,#171d2b,var(--void) 70%); z-index:100; display:flex; flex-direction:column; align-items:center; padding:calc(20px + var(--safe-top)) 16px calc(20px + var(--safe-bottom)); overflow-y:auto;}
.reveal-header{width:100%; max-width:520px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.reveal-progress{font-family:var(--font-mono); font-size:13px; color:var(--dim);}
.close-x{width:34px; height:34px; border-radius:50%; background:var(--panel); display:flex; align-items:center; justify-content:center; color:var(--dim);}
.stage{flex:1; width:100%; max-width:400px; display:flex; align-items:center; justify-content:center; perspective:1200px;}
.flipcard{width:250px; height:349px; position:relative; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.8,.2,1); touch-action:none;}
.flipcard.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; overflow:hidden; box-shadow:0 25px 60px -15px rgba(0,0,0,0.7);}
.face.back{background:linear-gradient(160deg,#232a3d,#0e1119); border:1px solid var(--edge); display:flex; align-items:center; justify-content:center;}
.face.back .mark{width:60px; height:60px; border-radius:50%; background:conic-gradient(var(--cyan),var(--magenta),var(--gold),var(--cyan)); opacity:0.6; animation:spin 4s linear infinite;}
.face.front{transform:rotateY(180deg); background:#0a0c10;}
.face.front img{width:100%; height:100%; object-fit:cover; display:block;}
.foil-layer{position:absolute; inset:0; mix-blend-mode:color-dodge; opacity:0; pointer-events:none; background:conic-gradient(from var(--ang,0deg), transparent, rgba(255,255,255,0.9), transparent 40%); transition:opacity .3s;}
.flipcard.rare-fx .foil-layer{opacity:0.55;}
.tier-badge{position:absolute; top:8px; left:8px; padding:4px 9px; border-radius:8px; font-family:var(--font-display); font-size:11px; font-weight:700; letter-spacing:0.03em; z-index:3; color:#08090c;}
.card-name{margin-top:16px; text-align:center; font-family:var(--font-display); font-weight:700; font-size:19px;}
.card-sub{text-align:center; color:var(--dim); font-size:13px; margin-top:2px;}
.tap-hint{color:var(--dim-2); font-size:12.5px; margin-top:14px; text-align:center;}
.reveal-footer{width:100%; max-width:400px; display:flex; gap:10px; margin-top:16px;}
.dots{display:flex; gap:6px; justify-content:center; margin-top:14px;}
.dots span{width:7px; height:7px; border-radius:50%; background:var(--edge);}
.dots span.done{background:var(--cyan);}
.dots span.done.hit{background:var(--gold);}

/* summary grid */
.summary-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; width:100%; max-width:520px; margin-top:6px;}
.summary-grid img{width:100%; border-radius:8px; aspect-ratio:63/88; object-fit:cover; border:1.5px solid var(--edge);}
.summary-grid .mini{position:relative;}
.summary-grid .mini.hit img{border-color:var(--gold); box-shadow:0 0 14px rgba(240,185,77,0.5);}

/* ---------- Collection ---------- */
.collection-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
.coll-item{position:relative; border-radius:10px; overflow:hidden; border:1px solid var(--edge);}
.coll-item img{width:100%; display:block; aspect-ratio:63/88; object-fit:cover;}
.coll-item .count{position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.7); font-size:11px; font-weight:700; padding:1px 6px; border-radius:6px; font-family:var(--font-mono);}
.empty-state{text-align:center; padding:60px 20px; color:var(--dim);}

/* ---------- Modals ---------- */
.overlay{position:fixed; inset:0; background:rgba(4,5,8,0.75); backdrop-filter:blur(4px); z-index:90; display:flex; align-items:flex-end;}
.sheet{width:100%; max-width:560px; margin:0 auto; background:var(--panel); border-radius:22px 22px 0 0; padding:22px 20px calc(24px + var(--safe-bottom)); max-height:85vh; overflow-y:auto; animation:slideup .25s ease;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:36px; height:4px; border-radius:99px; background:var(--edge); margin:0 auto 16px;}
.sheet h2{font-size:20px; margin:0 0 4px;}
.sheet .sub{color:var(--dim); font-size:13.5px; margin-bottom:18px;}
.refer-box{background:var(--panel-2); border:1px solid var(--edge); border-radius:14px; padding:14px; display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.refer-box code{flex:1; font-family:var(--font-mono); font-size:13px; color:var(--cyan); word-break:break-all;}
.bundle{display:flex; align-items:center; justify-content:space-between; background:var(--panel-2); border:1px solid var(--edge); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.bundle .amt{font-family:var(--font-display); font-weight:700; font-size:17px;}
.bundle .sub{color:var(--dim); font-size:12px; margin:0;}
.bundle .price{font-family:var(--font-mono); font-weight:700;}
.toast{position:fixed; top:calc(14px + var(--safe-top)); left:50%; transform:translateX(-50%); background:var(--panel); border:1px solid var(--edge); padding:11px 18px; border-radius:12px; font-size:13.5px; z-index:200; opacity:0; transition:opacity .25s, transform .25s;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(4px);}

.confetti-canvas{position:fixed; inset:0; pointer-events:none; z-index:150;}
</style>
</head>
<body>

<canvas class="confetti-canvas" id="confetti"></canvas>
<div id="toast" class="toast"></div>
<div id="app"></div>

<script type="module">
/* ============================================================
   CONFIG — fill these in with your own project values.
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://YOUR-PROJECT.supabase.co',
  SUPABASE_ANON_KEY: 'YOUR-ANON-KEY',
  POKEMON_TCG_API_KEY: '', // optional — works without one at low volume, get one free at pokemontcg.io/developers to raise the rate limit
  STRIPE_LINKS: {
    // Stripe Payment Links (Dashboard → Payment Links). Success URL on each
    // should redirect back to this page with ?bought=KEY so credits can be
    // reconciled. Real crediting happens server-side — see the Stripe
    // webhook + add_credits() note at the bottom of this file's comments.
    starter: 'https://buy.stripe.com/REPLACE_ME_5',
    booster: 'https://buy.stripe.com/REPLACE_ME_20',
    elite:   'https://buy.stripe.com/REPLACE_ME_50',
  },
  ECONOMY: {
    STARTING_CREDITS: 500,      // one free pack on signup
    PACK_COST: 450,             // pegged near a real single-pack retail price (~$4.50) at 100 credits = $1
    GUEST_CREDITS: 450,         // guests get exactly one free pack, once, ever, on this device
    REFERRAL_BONUS: 250,        // each side gets this on a successful referral
    BUNDLES: [
      { key:'starter', credits:500,  price:'$5',  bonus:'' },
      { key:'booster', credits:2200, price:'$20', bonus:'+10% bonus' },
      { key:'elite',   credits:6000, price:'$50', bonus:'+20% bonus' },
    ],
  },
};

/* ============================================================
   Supabase client
   ============================================================ */
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

/* ============================================================
   Tiny utilities
   ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; };
function toast(msg, ms=2400){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), ms);
}
function vibrate(pattern){ if(navigator.vibrate) try{navigator.vibrate(pattern);}catch(e){} }
const store = {
  get(k, fallback=null){ try{ return JSON.parse(localStorage.getItem(k)) ?? fallback; }catch(e){ return fallback; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};

/* ============================================================
   Sound design — tiny synth engine, no audio files needed
   ============================================================ */
let actx;
function audioCtx(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(freq, dur, type='sine', gain=0.05, delay=0){
  const ctx = audioCtx(); const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g).connect(ctx.destination); osc.start(t0); osc.stop(t0+dur+0.02);
}
const SFX = {
  flip(){ tone(320,0.09,'triangle',0.04); tone(480,0.07,'triangle',0.03,0.03); },
  common(){ tone(280,0.15,'sine',0.03); },
  uncommon(){ tone(340,0.12,'sine',0.04); tone(460,0.14,'sine',0.03,0.05); },
  holo(){ tone(392,0.15,'sine',0.05); tone(523,0.18,'sine',0.045,0.06); tone(659,0.22,'sine',0.04,0.12); },
  hit(){ [523,659,784,1047].forEach((f,i)=>tone(f,0.28,'triangle',0.05,i*0.07)); },
  chase(){ [392,494,587,698,880,1047,1175].forEach((f,i)=>tone(f,0.35,'sawtooth',0.035,i*0.06)); },
  coin(){ tone(880,0.08,'square',0.03); tone(1100,0.09,'square',0.03,0.05); },
};

/* ============================================================
   Confetti — lightweight custom particle burst
   ============================================================ */
const confettiCanvas = $('#confetti'); const cctx = confettiCanvas.getContext('2d');
function resizeConfetti(){ confettiCanvas.width = innerWidth; confettiCanvas.height = innerHeight; }
addEventListener('resize', resizeConfetti); resizeConfetti();
let particles = [];
function burstConfetti(count=60, colors=['#4de8e0','#e84dc0','#f0b94d','#ffffff']){
  const cx = innerWidth/2, cy = innerHeight*0.4;
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2, speed = 3+Math.random()*7;
    particles.push({ x:cx, y:cy, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed-3, life:1, size:4+Math.random()*4, color:colors[i%colors.length], rot:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3 });
  }
  if(!burstConfetti._running){ burstConfetti._running = true; requestAnimationFrame(tickConfetti); }
}
function tickConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  particles.forEach(p=>{ p.vy += 0.15; p.x += p.vx; p.y += p.vy; p.life -= 0.012; p.rot += p.vr;
    cctx.save(); cctx.globalAlpha = Math.max(p.life,0); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
    cctx.fillStyle = p.color; cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); cctx.restore();
  });
  particles = particles.filter(p=>p.life>0 && p.y < innerHeight+50);
  if(particles.length){ requestAnimationFrame(tickConfetti); } else { burstConfetti._running=false; }
}

/* ============================================================
   Pokémon TCG API — real data, cached in localStorage.
   This API is community-run and has real reliability issues
   (rate limits without a key, occasional timeouts), so requests
   retry with backoff and fall back to stale cache rather than
   hard-failing on the first hiccup.
   ============================================================ */
const TCG_BASE = 'https://api.pokemontcg.io/v2';
async function tcgFetch(path, attempt=1){
  const headers = CONFIG.POKEMON_TCG_API_KEY ? { 'X-Api-Key': CONFIG.POKEMON_TCG_API_KEY } : {};
  const ctrl = new AbortController();
  const timeout = setTimeout(()=>ctrl.abort(), 10000);
  try{
    const res = await fetch(TCG_BASE + path, { headers, signal: ctrl.signal });
    if(res.status === 429 && attempt < 3){
      await new Promise(r=>setTimeout(r, attempt*1200));
      return tcgFetch(path, attempt+1);
    }
    if(!res.ok){
      const err = new Error('Pokémon TCG API error ' + res.status);
      err.status = res.status;
      throw err;
    }
    return (await res.json()).data;
  }catch(e){
    if(attempt < 3 && (e.name==='AbortError' || e.status>=500 || !e.status)){
      await new Promise(r=>setTimeout(r, attempt*1000));
      return tcgFetch(path, attempt+1);
    }
    throw e;
  }finally{ clearTimeout(timeout); }
}
async function getSets(){
  const cached = store.get('cache_sets');
  if(cached && Date.now() - cached.t < 1000*60*60*12) return cached.data;
  try{
    const data = await tcgFetch('/sets?orderBy=-releaseDate');
    store.set('cache_sets', { t: Date.now(), data });
    return data;
  }catch(e){
    if(cached){ toast('Showing cached sets — live data unavailable'); return cached.data; }
    throw e;
  }
}
async function getCardsForSet(setId){
  const key = 'cache_cards_' + setId;
  const cached = store.get(key);
  if(cached && Date.now() - cached.t < 1000*60*60*24*7) return cached.data;
  try{
    const data = await tcgFetch(`/cards?q=set.id:${setId}&pageSize=250`);
    store.set(key, { t: Date.now(), data });
    return data;
  }catch(e){
    if(cached){ toast('Showing cached cards — live data unavailable'); return cached.data; }
    throw e;
  }
}

/* ============================================================
   Rarity tiering — classifies whatever real rarity string the API
   returns into a tier, so odds work across every era (base set
   through the newest Scarlet & Violet sets) without hardcoding
   per-set rarity lists.
   ============================================================ */
const TIERS = [
  { id:0, key:'common', label:'Common', color:'var(--tier-common)', match:/^common$/i },
  { id:1, key:'uncommon', label:'Uncommon', color:'var(--tier-uncommon)', match:/^uncommon$/i },
  { id:2, key:'rare', label:'Rare', color:'var(--tier-rare)', match:/^rare$/i },
  { id:3, key:'holo', label:'Holo Rare', color:'var(--tier-holo)', match:/rare holo$|classic collection|radiant|amazing|ace spec|rare holo lv\.?x/i },
  { id:4, key:'double', label:'Double Rare', color:'var(--tier-double)', match:/\b(ex|gx|v|vmax|vstar|break|prime|shining)\b/i },
  { id:5, key:'ultra', label:'Ultra Rare', color:'var(--tier-ultra)', match:/rare ultra|full art|rare shiny$/i },
  { id:6, key:'illustration', label:'Illustration Rare', color:'var(--tier-illus)', match:/^illustration rare$/i },
  { id:7, key:'sillustration', label:'Special Illustration Rare', color:'var(--tier-sillus)', match:/special illustration|rare rainbow|trainer gallery/i },
  { id:8, key:'hyper', label:'Hyper / Secret Rare', color:'var(--tier-hyper)', match:/hyper|secret|rare shiny gx|gold/i },
];
function classify(rarity){
  if(!rarity) return TIERS[0];
  for(let i=TIERS.length-1;i>=1;i--){ if(TIERS[i].match.test(rarity)) return TIERS[i]; }
  if(/rare/i.test(rarity)) return TIERS[2];
  if(/uncommon/i.test(rarity)) return TIERS[1];
  return TIERS[0];
}
function groupBySets(cards){
  const buckets = {};
  cards.forEach(c=>{ const t = classify(c.rarity).id; (buckets[t] ??= []).push(c); });
  return buckets;
}
// Community-tracked hit-slot weighting (Scarlet & Violet era baseline —
// see PokeBeach's SV pack-structure breakdown and third-party sampling
// summarized by TCGZen/PackKingdom/Ravaver). Sourced, not invented; only
// tiers that actually exist in a given set are used, renormalized.
const HIT_WEIGHTS = { 2:25, 3:40, 4:20, 5:8, 6:4, 7:2, 8:1 };
const GOD_PACK_ODDS = 1/600; // matches community-documented god-pack rate for modern sets

function weightedPick(pool, weights){
  const tiersAvail = Object.keys(pool).map(Number).filter(t=>t>=2 && pool[t]?.length);
  if(!tiersAvail.length) return null;
  const total = tiersAvail.reduce((s,t)=>s+(weights[t]||1),0);
  let r = Math.random()*total;
  for(const t of tiersAvail){ r -= (weights[t]||1); if(r<=0) return pickFrom(pool[t]); }
  return pickFrom(pool[tiersAvail[tiersAvail.length-1]]);
}
function pickFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generatePack(cards){
  const buckets = groupBySets(cards);
  const commons = buckets[0]?.length ? buckets[0] : (buckets[1]||buckets[2]||cards);
  const uncommons = buckets[1]?.length ? buckets[1] : commons;
  const reverseHoloPool = [...(buckets[0]||[]), ...(buckets[1]||[]), ...(buckets[2]||[])];
  const isGodPack = Math.random() < GOD_PACK_ODDS;
  const pack = [];
  for(let i=0;i<4;i++) pack.push({ card: pickFrom(commons), foil:false });
  for(let i=0;i<3;i++) pack.push({ card: pickFrom(uncommons), foil:false });
  pack.push({ card: pickFrom(reverseHoloPool.length?reverseHoloPool:commons), foil:true });
  for(let i=0;i<2;i++){
    let card;
    if(isGodPack){ const hi = buckets[8]||buckets[7]||buckets[6]||buckets[5]||buckets[4]||buckets[3]; card = hi ? pickFrom(hi) : weightedPick(buckets, HIT_WEIGHTS); }
    else card = weightedPick(buckets, HIT_WEIGHTS);
    pack.push({ card, foil: classify(card?.rarity).id >= 3 });
  }
  return { cards: pack.filter(p=>p.card), godPack: isGodPack };
}

/* ============================================================
   Auth & profile
   ============================================================ */
let session = null, profile = null, guestMode = false;

/* Guest credits live only in localStorage on this device — no server
   record, so they can never be topped up with real money (there's no
   account for a webhook to credit). This is the enforced ceiling on
   what guest mode can do, not just a UI choice. */
function getGuestState(){
  return store.get('guest_state', { credits: null, usedFreePack: false });
}
function setGuestState(s){ store.set('guest_state', s); }
function startGuestSession(){
  guestMode = true;
  let s = getGuestState();
  if(s.credits === null){ s = { credits: CONFIG.ECONOMY.GUEST_CREDITS, usedFreePack: false }; setGuestState(s); }
  render('home');
}
function exitGuestMode(){ guestMode = false; render('auth'); }
function currentCredits(){ return guestMode ? (getGuestState().credits ?? 0) : (profile?.credits ?? 0); }

async function initAuth(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_evt, s)=>{ session = s; if(s){ guestMode = false; onLoggedIn(); } else render('auth'); });
  if(session) await onLoggedIn(); else render('auth');
}
async function onLoggedIn(){
  await loadProfile();
  const pendingRef = store.get('pending_ref');
  if(pendingRef && profile){
    try{ await sb.rpc('redeem_referral', { p_code: pendingRef }); store.set('pending_ref', null); await loadProfile(); toast('Referral bonus applied — +' + CONFIG.ECONOMY.REFERRAL_BONUS + ' credits'); }
    catch(e){ store.set('pending_ref', null); }
  }
  render('home');
}
async function loadProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if(!error) profile = data;
}
async function sendMagicLink(email){
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.href.split('#')[0] } });
  if(error) throw error;
}

// capture ?ref=CODE before anything else
(function captureRef(){
  const p = new URLSearchParams(location.search);
  if(p.get('ref')) store.set('pending_ref', p.get('ref'));
})();

/* ============================================================
   Views
   ============================================================ */
const app = $('#app');
let route = { name:'home' };

function render(name, params={}){
  route = { name, params };
  app.innerHTML = '';
  if(name==='auth') return renderAuth();
  app.appendChild(renderTopbar());
  if(name==='home') renderHome();
  if(name==='set') renderSetDetail(params.set);
  if(name==='collection') renderCollection();
  if(name!=='auth') app.appendChild(renderTabs());
}

function renderAuth(){
  const wrap = el('div','auth-wrap');
  wrap.innerHTML = `
    <div>
      <div class="display" style="font-size:15px;letter-spacing:.2em;color:var(--cyan);margin-bottom:10px;">PACKPULL</div>
      <div class="display">Open real packs.<br/>Pull real cards.</div>
      <p class="sub">Every card comes straight from the official Pokémon TCG database. No fake rarities, no made-up odds — just booster mechanics modeled on real, community-verified pull rates.</p>
    </div>
    <form class="auth-form" id="auth-form">
      <input type="email" id="email-input" placeholder="you@email.com" required autocomplete="email" inputmode="email"/>
      <button class="btn btn-primary" type="submit">Email me a sign-in link</button>
      <div class="hint">No password. We'll email you a one-tap link.</div>
      <button class="btn btn-secondary" type="button" id="guest-btn" style="margin-top:2px;">Continue as guest</button>
      <div class="hint">Guests get one free pack on this device — no saved collection across devices, no referrals, no buying credits until you sign up.</div>
    </form>
  `;
  app.appendChild(wrap);
  $('#auth-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const btn = e.target.querySelector('button'); const email = $('#email-input').value.trim();
    btn.disabled = true; btn.textContent = 'Sending…';
    try{ await sendMagicLink(email); btn.textContent = 'Check your email ✓'; }
    catch(err){ btn.disabled=false; btn.textContent='Email me a sign-in link'; toast(err.message||'Could not send link'); }
  });
  $('#guest-btn', wrap).addEventListener('click', startGuestSession);
}

function renderTopbar(){
  const bar = el('div','topbar');
  bar.innerHTML = `
    <div class="brand"><span class="dot"></span>PackPull${guestMode ? ' <span style="font-size:10px;color:var(--dim-2);font-weight:700;letter-spacing:.08em;background:var(--panel);border:1px solid var(--edge);padding:2px 7px;border-radius:999px;margin-left:6px;">GUEST</span>' : ''}</div>
    <button class="credits-pill tappable" id="credits-btn"><span class="coin"></span><span id="credit-count">${currentCredits()}</span></button>
  `;
  bar.querySelector('#credits-btn').addEventListener('click', ()=> openGetCreditsModal());
  return bar;
}

function renderTabs(){
  const tabs = el('div','tabs');
  const items = [
    { key:'home', label:'Packs', icon:'M4 12l8-8 8 8M6 10v10h12V10' },
    { key:'collection', label:'Collection', icon:'M4 6h16M4 12h16M4 18h16' },
  ];
  items.forEach(it=>{
    const t = el('div','tab'+(route.name===it.key?' active':''));
    t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="${it.icon}"/></svg><span>${it.label}</span>`;
    t.addEventListener('click', ()=> render(it.key));
    tabs.appendChild(t);
  });
  return tabs;
}

async function renderHome(){
  const setsWrap = el('div');
  setsWrap.innerHTML = `<div class="section-title">Choose a booster</div><div class="set-grid" id="set-grid"></div>`;
  app.appendChild(setsWrap);
  const grid = $('#set-grid');
  for(let i=0;i<6;i++){ const s = el('div','set-card skeleton'); s.style.height='96px'; grid.appendChild(s); }
  try{
    const sets = await getSets();
    grid.innerHTML = '';
    sets.forEach(s=>{
      const card = el('div','set-card');
      card.innerHTML = `<img src="${s.images.symbol}" alt=""/><div class="name">${s.name}</div><div class="meta">${s.series} · ${s.total} cards</div>`;
      card.addEventListener('click', ()=> render('set', { set: s }));
      grid.appendChild(card);
    });
  }catch(e){
    const msg = e.status === 429
      ? 'The card database is rate-limiting us right now. This is much rarer with a free API key set in CONFIG.POKEMON_TCG_API_KEY.'
      : 'Couldn\'t reach the Pokémon TCG API — it can be flaky. Nothing was charged.';
    grid.innerHTML = `<div class="hint" style="grid-column:1/-1;text-align:center;padding:20px 8px;">${msg}</div>`;
    const retryBtn = el('button','btn btn-secondary');
    retryBtn.textContent = 'Retry';
    retryBtn.style.gridColumn = '1/-1';
    retryBtn.addEventListener('click', ()=> render('home'));
    grid.appendChild(retryBtn);
  }
}

async function renderSetDetail(setMeta){
  const wrap = el('div');
  wrap.innerHTML = `
    <div class="pack-hero">
      <img class="logo" src="${setMeta.images.logo}" alt=""/>
      <div class="pack-art" id="pack-art"><img src="${setMeta.images.logo}" style="object-fit:contain;padding:30px;opacity:.85"/></div>
      <div class="pack-count">10 cards per pack · ${setMeta.total} cards in ${setMeta.name}</div>
      <button class="btn btn-primary" id="open-pack-btn" style="width:100%;">Open pack — ${CONFIG.ECONOMY.PACK_COST} credits</button>
      <div class="odds-box">
        <div class="row"><span>Structure</span><b>4 common · 3 uncommon · 1 reverse holo · 2 hit slots</b></div>
        <div class="row"><span>Hit-slot odds</span><b>modeled on SV-era community data</b></div>
        <div class="row"><span>God pack chance</span><b>1 in 600</b></div>
      </div>
    </div>
  `;
  app.appendChild(wrap);
  $('#open-pack-btn').addEventListener('click', ()=> beginOpen(setMeta));
}

async function beginOpen(setMeta){
  if(currentCredits() < CONFIG.ECONOMY.PACK_COST){ return openGetCreditsModal(true); }
  const btn = $('#open-pack-btn'); btn.disabled = true; btn.textContent = 'Loading real cards…';
  try{
    const cards = await getCardsForSet(setMeta.id);

    if(guestMode){
      const gs = getGuestState();
      gs.credits -= CONFIG.ECONOMY.PACK_COST;
      gs.usedFreePack = true;
      setGuestState(gs);
      $('#credit-count').textContent = gs.credits;
    } else {
      const { data: newBalance, error } = await sb.rpc('spend_credits', { p_amount: CONFIG.ECONOMY.PACK_COST });
      if(error) throw error;
      profile.credits = newBalance; $('#credit-count').textContent = newBalance;
    }

    const pack = generatePack(cards);

    if(!guestMode){
      // guest openings are never written server-side — there's no
      // account to attach them to, by design
      await sb.from('openings').insert({ user_id: session.user.id, set_id: setMeta.id, set_name: setMeta.name, cards: pack.cards.map(p=>({id:p.card.id,name:p.card.name,rarity:p.card.rarity,image:p.card.images.small})), cost: CONFIG.ECONOMY.PACK_COST });
    }
    persistToCollection(pack.cards);
    openRevealScreen(setMeta, pack);
  }catch(e){
    toast(e.message==='insufficient_credits' ? 'Not enough credits' : 'Something went wrong — try again');
  }finally{ btn.disabled=false; btn.textContent = `Open pack — ${CONFIG.ECONOMY.PACK_COST} credits`; }
}

function persistToCollection(packCards){
  const coll = store.get('collection', {});
  packCards.forEach(p=>{
    const c = p.card;
    coll[c.id] = coll[c.id] || { name:c.name, image:c.images.small, rarity:c.rarity, count:0 };
    coll[c.id].count++;
  });
  store.set('collection', coll);
}

function openRevealScreen(setMeta, pack){
  const screen = el('div','reveal-screen');
  let idx = 0; let bestTier = 0;
  screen.innerHTML = `
    <div class="reveal-header">
      <div class="reveal-progress" id="prog">Card 1 / ${pack.cards.length}</div>
      <button class="close-x" id="close-reveal">✕</button>
    </div>
    <div class="stage"><div class="flipcard" id="flipcard">
      <div class="face back"><div class="mark"></div></div>
      <div class="face front"><img id="front-img" src="" alt=""/><div class="foil-layer" id="foil"></div><div class="tier-badge" id="tier-badge"></div></div>
    </div></div>
    <div class="card-name" id="card-name">&nbsp;</div>
    <div class="card-sub" id="card-sub">&nbsp;</div>
    <div class="dots" id="dots"></div>
    <div class="tap-hint" id="tap-hint">Tap the card to flip it</div>
  `;
  document.body.appendChild(screen);
  const dotsWrap = $('#dots', screen);
  pack.cards.forEach(()=> dotsWrap.appendChild(el('span')));
  $('#close-reveal', screen).addEventListener('click', ()=>{ screen.remove(); showSummary(setMeta, pack); });

  function showCard(i){
    const p = pack.cards[i]; const tier = classify(p.card.rarity);
    bestTier = Math.max(bestTier, tier.id);
    $('#prog', screen).textContent = `Card ${i+1} / ${pack.cards.length}`;
    $('#front-img', screen).src = p.card.images.large || p.card.images.small;
    $('#card-name', screen).textContent = p.card.name;
    $('#card-sub', screen).textContent = `${p.card.rarity || 'Common'}${p.foil ? ' · Foil' : ''} — ${p.card.set?.name || setMeta.name}`;
    const badge = $('#tier-badge', screen); badge.textContent = tier.label; badge.style.background = tier.color;
    const flip = $('#flipcard', screen); flip.classList.remove('flipped','rare-fx');
    if(tier.id >= 3) flip.classList.add('rare-fx');
    $('#tap-hint', screen).textContent = 'Tap the card to flip it';
    flip.dataset.done = '0';
  }
  function markDot(i, tier){
    const dot = dotsWrap.children[i]; dot.classList.add('done'); if(tier>=4) dot.classList.add('hit');
  }
  function foilTilt(e){
    const flip = $('#flipcard', screen); if(!flip.classList.contains('rare-fx')) return;
    const rect = flip.getBoundingClientRect();
    const cx = (e.touches?e.touches[0].clientX:e.clientX) - rect.left, cy = (e.touches?e.touches[0].clientY:e.clientY) - rect.top;
    const ang = Math.atan2(cy-rect.height/2, cx-rect.width/2) * 180/Math.PI;
    $('#foil', screen).style.setProperty('--ang', ang+'deg');
  }
  screen.addEventListener('pointermove', foilTilt);
  showCard(0);

  $('#flipcard', screen).addEventListener('click', function(){
    if(this.dataset.done==='1'){
      idx++;
      if(idx >= pack.cards.length){ screen.remove(); showSummary(setMeta, pack); return; }
      this.classList.remove('flipped'); this.dataset.done='0';
      setTimeout(()=>showCard(idx), 180);
      return;
    }
    this.classList.add('flipped'); this.dataset.done='1';
    const tier = classify(pack.cards[idx].card.rarity);
    markDot(idx, tier.id);
    SFX.flip();
    setTimeout(()=>{
      if(tier.id>=7){ SFX.chase(); vibrate([30,60,30,60,80]); burstConfetti(90); }
      else if(tier.id>=4){ SFX.hit(); vibrate([20,40,20]); burstConfetti(45); }
      else if(tier.id>=3){ SFX.holo(); vibrate(15); burstConfetti(18); }
      else if(tier.id===1){ SFX.uncommon(); }
      else SFX.common();
    }, 250);
    $('#tap-hint', screen).textContent = idx < pack.cards.length-1 ? 'Tap to reveal the next card' : 'Tap to see your full pack';
  });
}

function showSummary(setMeta, pack){
  const overlay = el('div','overlay');
  const sheet = el('div','sheet');
  const best = pack.cards.reduce((a,b)=> classify(b.card.rarity).id > classify(a.card.rarity).id ? b : a);
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h2>${pack.godPack ? '⚡ GOD PACK!' : 'Pack opened'}</h2>
    <div class="sub">Best pull: <b style="color:var(--text)">${best.card.name}</b> — ${best.card.rarity}</div>
    <div class="summary-grid" id="sum-grid"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:18px;" id="sum-close">Done</button>
  `;
  overlay.appendChild(sheet); document.body.appendChild(overlay);
  const grid = $('#sum-grid', sheet);
  pack.cards.forEach(p=>{
    const tier = classify(p.card.rarity);
    const mini = el('div','mini'+(tier.id>=4?' hit':''));
    mini.innerHTML = `<img src="${p.card.images.small}"/>`;
    grid.appendChild(mini);
  });
  $('#sum-close', sheet).addEventListener('click', ()=>{ overlay.remove(); render('home'); });
}

function renderCollection(){
  const coll = store.get('collection', {});
  const keys = Object.keys(coll);
  const wrap = el('div');
  if(!keys.length){
    wrap.innerHTML = `<div class="section-title">Collection</div><div class="empty-state">No cards yet — open your first pack to start your binder.</div>`;
  } else {
    wrap.innerHTML = `<div class="section-title">Collection · ${keys.length} unique cards</div><div class="collection-grid" id="coll-grid"></div>`;
  }
  app.appendChild(wrap);
  if(keys.length){
    const grid = $('#coll-grid');
    keys.sort((a,b)=> classify(coll[b].rarity).id - classify(coll[a].rarity).id).forEach(id=>{
      const c = coll[id]; const item = el('div','coll-item');
      item.innerHTML = `<img src="${c.image}"/><span class="count">×${c.count}</span>`;
      grid.appendChild(item);
    });
  }
}

/* ============================================================
   Get Credits modal — refer a friend / buy a bundle
   ============================================================ */
function openGetCreditsModal(lowBalance=false){
  const overlay = el('div','overlay');
  const sheet = el('div','sheet');

  if(guestMode){
    sheet.innerHTML = `
      <div class="sheet-handle"></div>
      <h2>${lowBalance ? 'Your free pack is used up' : 'Get more credits'}</h2>
      <div class="sub">Guest mode gets one free pack per device and that's it — no referrals, no buying credits, and your collection won't follow you to another device or browser.</div>
      <div class="bundle" style="flex-direction:column;align-items:stretch;gap:10px;">
        <div>
          <div class="amt">Create a free account</div>
          <p class="sub">Keeps your collection, unlocks referrals (+${CONFIG.ECONOMY.REFERRAL_BONUS} credits each), and lets you buy credit bundles.</p>
        </div>
        <button class="btn btn-primary" id="guest-signup-btn" style="width:100%;">Sign up — takes 10 seconds</button>
      </div>
    `;
    overlay.appendChild(sheet); document.body.appendChild(overlay);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
    $('#guest-signup-btn', sheet).addEventListener('click', ()=>{ overlay.remove(); exitGuestMode(); });
    return;
  }

  const refLink = `${location.origin}${location.pathname}?ref=${profile?.referral_code || ''}`;
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <h2>${lowBalance ? 'Not enough credits' : 'Get more credits'}</h2>
    <div class="sub">Refer a friend for free credits, or top up instantly.</div>
    <div class="refer-box">
      <code id="ref-link">${refLink}</code>
      <button class="btn btn-secondary" id="copy-ref">Copy</button>
    </div>
    <div class="hint" style="margin-bottom:18px;">You both get +${CONFIG.ECONOMY.REFERRAL_BONUS} credits when they sign up.</div>
    <div class="section-title" style="margin-top:0;">Buy credits</div>
    ${CONFIG.ECONOMY.BUNDLES.map(b=>`
      <div class="bundle">
        <div>
          <div class="amt">${b.credits.toLocaleString()} credits</div>
          <p class="sub">${b.bonus || `≈ ${Math.floor(b.credits/CONFIG.ECONOMY.PACK_COST)} packs`}</p>
        </div>
        <a class="btn btn-gold" href="${CONFIG.STRIPE_LINKS[b.key]}" target="_blank" rel="noopener">${b.price}</a>
      </div>
    `).join('')}
    <div class="hint">Credits are added automatically within a minute of payment.</div>
  `;
  overlay.appendChild(sheet); document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  $('#copy-ref', sheet).addEventListener('click', ()=>{
    navigator.clipboard?.writeText(refLink); SFX.coin(); toast('Referral link copied');
  });
}

   Boot
